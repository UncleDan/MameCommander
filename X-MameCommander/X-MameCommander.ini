; X-MameCommander - frontend testuale per MAME avviato dentro una finestra cmd.exe
;--------------------------------------------------------------------------------
; STRUTTURA ATTESA SULLA CHIAVETTA:
;
;   X-MameCommander.exe          <- launcher X-Launcher (rinominato)
;   X-MameCommander.ini          <- questo file
;   Bin\
;     MameCommander\
;       MameCommander.exe        <- il frontend compilato con PyInstaller
;       MameCommander.db         <- cache, creata al primo avvio
;       mame.exe                 <- MAME
;       roms\                    <- i romset
;
; IMPORTANTE: MameCommander.exe cerca mame.exe, la cartella roms e il
; proprio database NELLA PROPRIA CARTELLA, non nella directory di lavoro.
; Per questo deve stare dentro la stessa cartella di MAME (Bin\MameCommander),
; e non in una cartella separata. Cosi' tutto - frontend, emulatore, ROM e
; cache - resta sulla chiavetta e non tocca nulla del PC ospite.
;--------------------------------------------------------------------------------

[Version]
Ini Author=Daniele Lolli
Ini Revision=1
Ini Date=01/09/2026
Ini Locale=it
Software=MameCommander
Soft.Author=Daniele Lolli
Soft.Version=1.0
Web=
Launcher=1.5.4
System=

[Group]
Category=Games
Sub Category=Emulators
License=

[FileSystem]
Root=@ScriptDir@
Bin=.\Bin

[Setup]
AppName=MameCommander

[FileToRun]
; Non lanciamo direttamente MameCommander.exe: passiamo per cmd.exe, cosi'
; il frontend gira dentro una finestra di console vera e propria (e' una
; interfaccia testuale curses, quindi la console gli serve davvero).
; %COMSPEC% e' la variabile standard di Windows che punta a cmd.exe: e'
; preferibile al percorso fisso, perche' funziona anche se il PC ospite
; ha Windows installato in una unita' o cartella diversa dal solito.
PathToExe=%COMSPEC%
WorkingDir=$Bin$\$AppName$

; L'eseguibile e' chiamato per NOME, senza percorso: WorkingDir qui sopra
; ha gia' portato cmd dentro la cartella giusta, e cmd cerca prima li'.
; Cosi' evitiamo virgolette annidate, che si rompono facilmente quando il
; percorso della chiavetta contiene spazi (es. "X Software\...").
;
; /C  = esegue il comando e CHIUDE la finestra all'uscita dal frontend.
; "mode con" allarga la console: una lista di giochi sta molto meglio in
; 100x40 che negli 80x25 predefiniti. Se non la vuoi, togli quel pezzo.
Parameters=/C "mode con: cols=100 lines=40 & MameCommander.exe"

; ALTERNATIVA UTILE IN FASE DI PROVA: /K invece di /C lascia la finestra
; APERTA dopo l'uscita, cosi' si legge un eventuale messaggio d'errore
; invece di vedere la finestra sparire in un lampo. Per usarla, commenta
; la riga Parameters qui sopra e decommenta questa:
;Parameters=/K "mode con: cols=100 lines=40 & MameCommander.exe"

; PER GENERARE IL LOG DI DEBUG (MameCommander_debug.log accanto all'exe):
;Parameters=/K "mode con: cols=100 lines=40 & MameCommander.exe -debug"

; X-Launcher, lasciato a se stesso, sorveglia cmd.exe. Indicando qui il
; processo reale del frontend, le operazioni della sezione [RunAfter]
; scattano quando esce MameCommander, non quando esce la shell.
WinGetProcess=MameCommander.exe

[Options]
; RunWait: X-Launcher resta in esecuzione finche' il frontend e' aperto.
; Necessario perche' [RunAfter] venga eseguito davvero.
RunWait=true
; Una sola sessione per volta: due copie che scrivono lo stesso
; MameCommander.db si sovrascriverebbero a vicenda.
MultipleIstances=false
; Nessuno splash: e' un programma da console, comparirebbe solo un lampo.
ShowSplash=false
DeleteTemp=true
WriteLog=false

[Environment]
; MAME 0.78b e altre versioni antiche cercano i propri file nella cartella
; corrente: la impostiamo esplicitamente, cosi' non dipendiamo da come e'
; stato avviato il launcher.
MAMEDIR=$Bin$\$AppName$

[RunBefore]

[RunAfter]
; La cache dei giochi (MameCommander.db) viene lasciata sulla chiavetta di
; proposito: e' cio' che rende istantaneo l'avvio successivo. Se invece
; preferissi ripartire ogni volta da una scansione pulita, decommenta:
;FileDelete=$Bin$\$AppName$\MameCommander.db

; Il log di debug, se generato, non serve conservarlo tra una sessione e
; l'altra: viene comunque riscritto da capo a ogni scansione.
FileDelete=$Bin$\$AppName$\MameCommander_debug.log
