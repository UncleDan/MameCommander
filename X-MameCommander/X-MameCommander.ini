; X-MameCommander - frontend testuale per MAME in versione portabile
;--------------------------------------------------------------------------------
; STRUTTURA ATTESA:
;
;   X-MameCommander.exe          <- launcher X-Launcher (rinominato)
;   X-MameCommander.ini          <- questo file
;   Bin\
;     MameCommander\
;       MameCommander.exe        <- il frontend compilato con PyInstaller
;       MameCommander.db         <- cache, creata al primo avvio
;       mame.exe                 <- MAME
;       roms\                    <- i romset
;
; Il launcher e il file .ini devono stare NELLO STESSO LIVELLO della
; cartella Bin. Se invece li tieni in una sottocartella, vedi la voce
; "Bin" nella sezione [FileSystem] piu' sotto: c'e' la riga pronta.
;
; IMPORTANTE: MameCommander.exe cerca mame.exe, la cartella roms e il
; proprio database NELLA PROPRIA CARTELLA, non nella directory di lavoro.
; Per questo deve stare dentro la stessa cartella di MAME (Bin\MameCommander),
; e non in una cartella separata. Cosi' tutto - frontend, emulatore, ROM e
; cache - resta sulla chiavetta e non tocca nulla del PC ospite.
;--------------------------------------------------------------------------------

[Version]
Ini Author=Daniele Lolli
Ini Revision=3
Ini Date=02/09/2026
Ini Locale=it
Software=MameCommander
Soft.Author=Daniele Lolli
Soft.Version=1.0
Web=
Launcher=1.5.4
System=

[Group]
Category=Games
Sub Category=Emulators
License=MIT

[FileSystem]
; @ScriptDir@ e' la cartella in cui si trova X-MameCommander.exe, e da li'
; si risolve tutto il resto. E' quindi la POSIZIONE DEL LAUNCHER a
; determinare dove viene cercato l'eseguibile: se il launcher si sposta,
; cambia anche il percorso di ricerca.
Root=@ScriptDir@

; Scegliere UNA delle due righe seguenti, in base a dove sta il launcher.
;
; CASO A - launcher nella radice di winPenPack (predefinito):
;     winPenPack\X-MameCommander.exe        <- launcher
;     winPenPack\Bin\MameCommander\...      <- programma
Bin=.\Bin

; CASO B - launcher in una SOTTOCARTELLA (per esempio winPenPack\XDrive),
; con Bin che sta un livello piu' in alto:
;     winPenPack\XDrive\X-MameCommander.exe <- launcher
;     winPenPack\Bin\MameCommander\...      <- programma
; In questo caso commentare la riga qui sopra e usare questa:
;Bin=..\Bin
;
; COME CAPIRE QUALE SERVE: il messaggio d'errore mostra sempre il percorso
; COMPLETO che X-Launcher ha provato. Confrontalo con quello reale: se
; contiene un segmento di troppo (es. ...\XDrive\Bin\... invece di
; ...\Bin\...), serve il CASO B.

[Setup]
AppName=MameCommander

[FileToRun]
; Si lancia DIRETTAMENTE l'eseguibile, senza passare per cmd.exe.
;
; PERCHE' NON SI USA PIU' cmd.exe (era la configurazione precedente):
; con "PathToExe=%COMSPEC%" non si apriva alcuna finestra e, al secondo
; tentativo, X-Launcher segnalava che il programma era gia' in
; esecuzione. Il motivo e' che X-Launcher non espande le variabili
; d'ambiente in PathToExe: cercava un file chiamato letteralmente
; "%COMSPEC%", non lo trovava, e restava in attesa di un processo che
; non sarebbe mai partito (RunWait + WinGetProcess). Il launcher
; rimaneva quindi in memoria, bloccando gli avvii successivi.
;
; Passare per la shell era comunque superfluo: MameCommander.exe e'
; compilato come applicazione DA CONSOLE, quindi apre da se' la propria
; finestra quando viene avviato. cmd.exe serviva solo a ridimensionarla.
PathToExe=$Bin$\$AppName$\MameCommander.exe
WorkingDir=$Bin$\$AppName$

; Per generare il log di debug (MameCommander_debug.log accanto all'exe)
; togliere il punto e virgola dalla riga seguente:
;Parameters=-debug

[Options]
; RunWait: X-Launcher resta in esecuzione finche' il frontend e' aperto.
; Necessario perche' [RunAfter] venga eseguito davvero.
RunWait=true
; Una sola sessione per volta: due copie che scrivono lo stesso
; MameCommander.db si sovrascriverebbero a vicenda.
;
; ATTENZIONE: se per qualsiasi motivo il launcher restasse bloccato in
; attesa, e' questa opzione a far comparire il messaggio "gia' in
; esecuzione" ai lanci successivi. In quel caso basta chiudere il
; processo X-MameCommander.exe dal Gestione attivita', oppure mettere
; temporaneamente MultipleIstances=true per rientrare.
MultipleIstances=false
; Nessuno splash: e' un programma da console, comparirebbe solo un lampo.
ShowSplash=false
DeleteTemp=true
; Utile in caso di problemi: mettendo true, X-Launcher scrive un log
; delle proprie operazioni e si vede subito cosa non e' riuscito a fare.
WriteLog=false

[Environment]
; MAME 0.78b e altre versioni antiche cercano i propri file nella cartella
; corrente: la impostiamo esplicitamente, cosi' non dipendiamo da come e'
; stato avviato il launcher.
MAMEDIR=$Bin$\$AppName$

[RunBefore]

[RunAfter]
; La cache dei giochi (MameCommander.db) viene lasciata sulla chiavetta di
; proposito: e' cio' che rende istantaneo l'avvio successivo. Se invece
; preferissi ripartire ogni volta da una scansione pulita, decommenta:
;FileDelete=$Bin$\$AppName$\MameCommander.db

; Il log di debug, se generato, non serve conservarlo tra una sessione e
; l'altra: viene comunque riscritto da capo a ogni scansione.
FileDelete=$Bin$\$AppName$\MameCommander_debug.log
