name: Build MameCommander

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

env:
  APP_NAME: MameCommander
  APP_VERSION: "1.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build monolithic executable with PyInstaller
        run: >
          pyinstaller --onefile --console
          --name ${{ env.APP_NAME }}
          --icon MameCommander.ico
          --workpath .pyi-work
          --specpath .pyi-work
          --distpath dist
          MameCommander.py

      - name: Rename artifact with version
        shell: pwsh
        run: |
          Copy-Item "dist/${{ env.APP_NAME }}.exe" "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows
          path: |
            dist/${{ env.APP_NAME }}.exe
            dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Create GitHub Release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.APP_VERSION }}
          files: |
            dist/${{ env.APP_NAME }}.exe
            dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
